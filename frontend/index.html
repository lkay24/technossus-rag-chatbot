<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Technossus Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-left">
        <span class="logo-mark">T</span>
        <span class="site-name">Technossus</span>
    </div>
    <div class="nav-right">
        <a href="#" class="nav-link">Help</a>
        <a href="#" class="nav-link">Settings</a>
        <div class="profile-badge">L</div>
    </div>
</nav>

<main class="page">

    <section class="hero" id="heroSection">
        <h1>How can I help you understand Technossus?</h1>
        <p class="hero-sub">Ask anything about our services, industries, or company.</p>

        <div class="suggestions">
            <button class="suggestion-card" data-prompt="What services does Technossus offer?">
                <span class="suggestion-title">What services do you provide?</span>
                <span class="suggestion-desc">Explore our core offerings</span>
            </button>
            <button class="suggestion-card" data-prompt="Summarize what Technossus does as a company.">
                <span class="suggestion-title">Summarize this website</span>
                <span class="suggestion-desc">Get the full picture, fast</span>
            </button>
            <button class="suggestion-card" data-prompt="What industries does Technossus work with?">
                <span class="suggestion-title">Which industries do you serve?</span>
                <span class="suggestion-desc">Healthcare, finance, and more</span>
            </button>
        </div>
    </section>

    <section class="chat-section" id="chatSection">
        <div class="chat-area" id="chatArea"></div>
    </section>

    <div class="composer-wrap">
        <form id="composerForm" class="composer">
            <textarea id="questionInput" placeholder="Ask anything about this website..." rows="1" required></textarea>
            <button type="submit" class="send-btn" id="sendBtn" aria-label="Send">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </form>
    </div>

</main>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</body>
</html>
